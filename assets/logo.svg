<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LeelaCloud logo">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D3B2E"/>
      <stop offset="52%" stop-color="#07221B"/>
      <stop offset="100%" stop-color="#051310"/>
    </linearGradient>
    <radialGradient id="lc-glow" cx="30%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#051310" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lc-mark" x1="0.2" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#F8FFFC"/>
      <stop offset="68%" stop-color="#D7F7EA"/>
      <stop offset="100%" stop-color="#86E8C2"/>
    </linearGradient>
    <linearGradient id="lc-cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Machined squircle container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lc-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lc-glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- Subtle architectural horizon ring -->
  <circle cx="256" cy="244" r="148" fill="none" stroke="#6EE7B7" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Stylized geometric Chess Knight emerging above the cloud horizon -->
  <path d="M 294 316
           C 305 270, 326 236, 322 184
           C 319 144, 290 112, 246 106
           L 234 86
           C 230 80, 220 82, 219 90
           L 216 112
           C 192 121, 173 141, 161 164
           L 142 199
           C 136 211, 143 226, 157 229
           L 190 236
           C 201 238, 211 232, 218 223
           L 231 206
           C 237 215, 237 229, 229 242
           C 214 266, 198 286, 194 316
           Z"
        fill="url(#lc-mark)"/>
  <!-- Precision eye accent -->
  <circle cx="209" cy="166" r="8.5" fill="#07221B"/>

  <!-- Minimalist Cloud base pedestal -->
  <path d="M 148 386
           L 364 386
           C 394 386, 416 364, 416 336
           C 416 310, 397 290, 372 287
           C 363 257, 336 236, 304 236
           C 295 236, 286 238, 278 241
           C 265 268, 248 292, 242 316
           L 194 316
           C 195 304, 199 292, 204 281
           C 196 279, 188 278, 180 278
           C 143 278, 114 307, 114 342
           C 114 367, 129 386, 148 386
           Z"
        fill="url(#lc-cloud)"/>
  <!-- Crisp cloud highlight rim -->
  <path d="M 150 374 L 362 374" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
</svg>
